<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body { font: 13px/1.5 -apple-system, Segoe UI, sans-serif; width: 280px; margin: 0; padding: 14px; color: #111; }
    h1 { font-size: 13.5px; margin: 0 0 8px; }
    #lastCheck { color: #444; margin-bottom: 12px; min-height: 32px; }
    button { width: 100%; padding: 8px; border: none; border-radius: 6px; background: #2563eb; color: #fff; font-size: 13px; font-weight: 600; cursor: pointer; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    a { color: #2563eb; font-size: 12px; }
    .paired-note { margin-top: 10px; font-size: 11.5px; color: #888; }
  </style>
</head>
<body>
  <h1>Dealer Agent — Marketplace poster</h1>
  <div id="lastCheck">Loading…</div>
  <button id="checkNow">Check now</button>
  <div class="paired-note"><a href="#" id="openOptions">Pairing settings</a></div>
  <script src="popup.js"></script>
</body>
</html>
